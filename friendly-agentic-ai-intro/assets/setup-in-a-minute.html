<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup in one minute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  /* A one-minute animation of the five setup steps.
     Everything is drawn in one SVG and driven by a single clock, t in seconds:
     render(t) sets every moving part, so the film can be paused, scrubbed, or
     stepped frame by frame (window.seek(t)) to record it as a video. */
  html, body { margin: 0; height: 100%; background: #15120f; }
  .film { position: relative; width: 100%; max-width: calc(100vh * 1280 / 780); margin: 0 auto; aspect-ratio: 1280 / 780; }
  svg { display: block; width: 100%; height: 92.308%; cursor: pointer; }
  .bar { height: 7.692%; display: flex; align-items: center; gap: 1.2vw; padding: 0 1.4vw; box-sizing: border-box;
         background: #15120f; border-top: 1px solid rgba(242, 165, 28, .35); font: 600 1.5vw "Source Sans 3", system-ui, sans-serif; color: #f6e9c6; }
  .bar button { font: inherit; color: #15120f; background: #f2a51c; border: 0; border-radius: .5vw; padding: .45vw 1.1vw; cursor: pointer; min-width: 7.5vw; }
  .bar button:hover { background: #f6e9c6; }
  .bar input { flex: 1; accent-color: #f2a51c; }
  .bar span { min-width: 6vw; text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
  .big { position: absolute; left: 50%; top: 73%; transform: translate(-50%, -50%); font: 700 2.2vw "Source Sans 3", system-ui, sans-serif;
         color: #15120f; background: #f2a51c; border: 0; border-radius: .7vw; padding: .8vw 2vw; cursor: pointer; box-shadow: 0 .6vw 1.6vw rgba(0,0,0,.5); }
  .big:hover { background: #f6e9c6; }
  .big[hidden] { display: none; }

  text { font-family: "Source Sans 3", system-ui, sans-serif; }
  .eyebrow { font-weight: 600; font-size: 17px; letter-spacing: .16em; fill: #f6e9c6; opacity: .8; }
  .title { font-family: "Alegreya", Georgia, serif; font-weight: 900; font-size: 46px; fill: #f2a51c; letter-spacing: .01em; }
  .cap { font-family: "Source Serif 4", Georgia, serif; font-size: 28px; fill: #f6e9c6; text-anchor: middle; }
  .ui { font-size: 21px; fill: #1f1b16; }
  .cream { fill: #f6e9c6; }
  .soft { fill: #5d564c; }
  .mono, .mono text { font-family: Consolas, "Courier New", monospace; }
  .b { font-weight: 700; }
</style>
</head>
<body>
<div class="film">
<svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A one-minute animation of the five setup steps: install the app, make a project folder, have a first conversation, let the agent set up Python, and install a Markdown reader.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">

    </radialGradient>
    <!-- the agent: a small robot with glowing eyes, as on the course poster -->

      <circle cx="45" cy="3" r="5" fill="#f2a51c"/>
      <rect x="8" y="14" width="74" height="58" rx="16" fill="#4a6770" stroke="#15120f" stroke-width="3"/>
      <circle cx="30" cy="40" r="14" fill="#f2a51c" opacity=".28"/><circle cx="60" cy="40" r="14" fill="#f2a51c" opacity=".28"/>
      <circle cx="30" cy="40" r="8.5" fill="#f2a51c"/><circle cx="60" cy="40" r="8.5" fill="#f2a51c"/>
      <circle cx="30" cy="40" r="3.5" fill="#fff3c4"/><circle cx="60" cy="40" r="3.5" fill="#fff3c4"/>
      <rect x="32" y="57" width="26" height="5" rx="2.5" fill="#15120f" opacity=".6"/>
    </g>
    <path id="tick" d="M0 9 L7 16 L19 2" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect x="14" y="14" width="1252" height="692" fill="none" stroke="#f2a51c" stroke-opacity=".45"/>

  <g id="hdr">
    <text x="64" y="66" class="eyebrow">PART 1 · SETUP</text>

<div class="bar">

<script>
(function () {
  const D = 60;                                   // length in seconds
  const SCENES = [[0, 4.5], [4.5, 13], [13, 22.5], [22.5, 34], [34, 44], [44, 52], [52, 60]];
  const $ = id => document.getElementById(id);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const lin = (t, a, b) => clamp((t - a) / (b - a));
  const p = (t, a, b) => ease(lin(t, a, b));     // eased progress from a to b
  const op = (id, v) => { $(id).style.opacity = v; };
  const tf = (id, v) => { $(id).setAttribute('transform', v); };
  const pop = (id, cx, cy, s) => tf(id, `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
  const tick = (id, v) => { $(id).style.strokeDashoffset = 1 - v; };
  const TYPED = 'Hi. What can you see in this folder?';
  const BARS = [92, 150, 112, 186, 134];

  function render(t) {
    // scenes fade in and out one after the other
    SCENES.forEach(([a, b], i) => {
      let v;
      if (i === 0) v = 1 - p(t, b - .5, b);
      else if (i === SCENES.length - 1) v = p(t, a, a + .6);
      else v = Math.min(p(t, a, a + .6), 1 - p(t, b - .5, b));
      const g = $('s' + i);
      g.style.opacity = v;
      g.style.display = v <= 0 ? 'none' : '';
    });
    op('hdr', p(t, 4.5, 5.1));
    op('dots', p(t, 4.5, 5.1));
    let cur = SCENES.findIndex(([a, b]) => t >= a && t < b);
    if (cur < 0) cur = 6;
    for (let i = 1; i <= 5; i++) $('d' + i).setAttribute('fill', i <= cur ? '#f2a51c' : 'none');

    // 1: the window comes in, then the highlight moves from Chat to Code
    op('s1win', p(t, 4.9, 5.7));
    tf('s1win', `translate(0 ${(1 - p(t, 4.9, 5.7)) * 30})`);
    $('s1hl').setAttribute('x', 360 + 124 * p(t, 8, 8.8));
    op('s1chat', 1 - p(t, 8, 8.7));
    op('s1code', p(t, 8.5, 9.3));
    op('s1lab', p(t, 9.3, 9.9));

    // 2: the folder is the desk; everything else moves out of reach
    op('s2desk', p(t, 13.6, 14.4));
    op('s2out', p(t, 13.6, 14.4) * (1 - .62 * p(t, 16.6, 17.6)));
    op('s2note', p(t, 17.2, 18));
    const b2 = p(t, 15, 15.9);
    op('s2bot', b2);
    tf('s2bot', `translate(${583} ${276 - (1 - b2) * 60}) scale(1.25)`);
    op('s2lab', p(t, 15.7, 16.4));

    // 3: a typed request, a question back, a click on Yes, a new file
    op('s3me', p(t, 23.1, 23.5));
    $('s3type').textContent = TYPED.slice(0, Math.round(lin(t, 23.5, 26.1) * TYPED.length));
    op('s3ans', p(t, 26.7, 27.4));
    op('s3btn', p(t, 27.7, 28.3));
    const c = p(t, 28.5, 29.7);
    op('s3cur', p(t, 28.3, 28.6) * (1 - p(t, 31.2, 31.8)));
    tf('s3cur', `translate(${600 - 304 * c} ${500 - 66 * c})`);
    const r = lin(t, 29.9, 30.6);
    $('s3ring').setAttribute('r', 10 + 44 * r);
    op('s3ring', r > 0 && r < 1 ? 1 - r : 0);
    $('s3yes').setAttribute('fill', t > 29.9 && t < 30.3 ? '#c8431c' : '#f2a51c');
    const f = p(t, 30.4, 31.1);
    op('s3file', f);
    pop('s3file', 980, 360, .6 + .4 * f);

    // 4: four steps ticked off, and a test chart
    for (let i = 0; i < 4; i++) {
      op('s4r' + i, p(t, 34.8 + i * 1.5, 35.3 + i * 1.5));
      tick('s4t' + i, p(t, 35.5 + i * 1.5, 35.9 + i * 1.5));
    }
    op('s4chart', p(t, 37.6, 38.3));
    BARS.forEach((h, i) => {
      const g = p(t, 38.3 + i * .15, 39.2 + i * .15) * h;
      $('s4b' + i).setAttribute('y', 440 - g);
      $('s4b' + i).setAttribute('height', g);
    });
    op('s4lab', p(t, 39.6, 40.2));

    // 5: the same file, raw and formatted
    op('s5raw', p(t, 44.6, 45.3));
    op('s5arr', p(t, 45.9, 46.5));
    op('s5doc', p(t, 46.3, 47.1));

    // 6: the checklist
    op('s6bot', p(t, 52.6, 53.4));
    for (let i = 0; i < 4; i++) {
      op('s6r' + i, p(t, 52.9 + i * .7, 53.4 + i * .7));
      tick('s6t' + i, p(t, 53.3 + i * .7, 53.7 + i * .7));
    }
    op('s6cta', p(t, 56.2, 57));
  }

  // ---- clock and controls ----
  let t = 0, playing = false, last = 0;
  const playBtn = $('play'), big = $('big'), scrub = $('scrub'), time = $('time');
  const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  function ui() {
    scrub.value = t;
    time.textContent = mmss(t) + ' / ' + mmss(D);
    playBtn.textContent = playing ? 'Pause' : (t >= D ? 'Replay' : 'Play');
    big.hidden = playing || t > 0;      // only on the title card; later the bar has Play and Replay
  }
  function frame(now) {
    if (!playing) return;
    t = Math.min(D, t + (now - last) / 1000);
    last = now;
    if (t >= D) playing = false;
    render(t); ui();
    if (playing) requestAnimationFrame(frame);
  }
  function play() {
    if (t >= D) t = 0;
    playing = true; last = performance.now(); ui();
    requestAnimationFrame(frame);
  }
  function toggle() { if (playing) { playing = false; ui(); } else play(); }

  playBtn.addEventListener('click', toggle);
  big.addEventListener('click', toggle);
  $('stage').addEventListener('click', toggle);
  scrub.addEventListener('input', () => { playing = false; t = +scrub.value; render(t); ui(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggle(); } });

  // for recording frame by frame: window.seek(seconds)
  window.seek = s => { playing = false; t = clamp(s / D) * D; render(t); ui(); return t; };

  render(0); ui();
  if (new URLSearchParams(location.search).has('autoplay')) play();
})();
</script>
</body>
</html>
